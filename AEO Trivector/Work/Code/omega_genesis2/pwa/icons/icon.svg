<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#bf5fff"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Glow effect -->
  <g filter="url(#blur)" opacity="0.5">
    <circle cx="256" cy="256" r="120" fill="#00f5ff"/>
  </g>
  
  <!-- Omega symbol Ω -->
  <text x="256" y="300" 
        font-family="Georgia, serif" 
        font-size="240" 
        font-weight="bold"
        fill="url(#glow)"
        text-anchor="middle" 
        dominant-baseline="middle">Ω</text>
  
  <!-- Equilibrium indicator -->
  <text x="256" y="420" 
        font-family="SF Mono, monospace" 
        font-size="36" 
        fill="#00f5ff"
        text-anchor="middle"
        opacity="0.8">μ = 0.569</text>
  
  <!-- Observer dots -->
  <circle cx="136" cy="156" r="12" fill="#00f5ff" opacity="0.6"/>
  <circle cx="376" cy="156" r="12" fill="#bf5fff" opacity="0.6"/>
  <circle cx="136" cy="356" r="12" fill="#bf5fff" opacity="0.6"/>
  <circle cx="376" cy="356" r="12" fill="#00f5ff" opacity="0.6"/>
  
  <!-- Connection lines -->
  <line x1="136" y1="156" x2="256" y2="256" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
  <line x1="376" y1="156" x2="256" y2="256" stroke="#bf5fff" stroke-width="1" opacity="0.3"/>
  <line x1="136" y1="356" x2="256" y2="256" stroke="#bf5fff" stroke-width="1" opacity="0.3"/>
  <line x1="376" y1="356" x2="256" y2="256" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
</svg>
